name: Dataset Issue to CSV PR

on:
  issues:
    types: [opened]

jobs:
  validate-and-create-pr:
    if: contains(github.event.issue.labels.*.name, 'dataset-submission-template')
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract Issue Body
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            function getField(label) {
              const regex = new RegExp(label + "\\s*\\n*\\s*(.*)");
              const match = body.match(regex);
              return match ? match[1].trim() : "";
            }

            const data = {
              year: getField("Year"),
              domain: getField("Domain"),
              title: getField("Title"),
              representation: getField("Representation"),
              realism: getField("Realism"),
              scale: getField("Scale"),
              url: getField("URL"),
              author: getField("Author")
            };

            return data;

      - name: Validate Entry
        id: validate
        run: |
          python3 - << 'EOF'
          import re, json, sys

          data = ${{ steps.extract.outputs.result }}

          required = ["year","domain","title","representation","realism","scale","url","author"]

          for f in required:
              if f not in data or not str(data[f]).strip():
                  print(f"Missing field: {f}")
                  sys.exit(1)

          if not data["year"].isdigit():
              print("Year must be numeric")
              sys.exit(1)

          if not (data["url"].startswith("http://") or data["url"].startswith("https://")):
              print("URL must start with http or https")
              sys.exit(1)

          valid_realism = ["Real","Synthetic","Anonymized"]
          valid_scale = ["Small/Single-domain","Large-Benchmark"]

          if data["realism"] not in valid_realism:
              print("Invalid realism")
              sys.exit(1)

          if data["scale"] not in valid_scale:
              print("Invalid scale")
              sys.exit(1)

          print("Validation passed")
          EOF

      - name: Check duplicates
        run: |
          python3 - << 'EOF'
          import csv, sys

          data = ${{ steps.extract.outputs.result }}

          with open("_data/catalog.csv") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  if row["title"] == data["title"] and row["url"] == data["url"]:
                      print("Duplicate entry detected")
                      sys.exit(1)
          print("No duplicates")
          EOF

      - name: Append to CSV
        run: |
          python3 - << 'EOF'
          import csv

          data = ${{ steps.extract.outputs.result }}

          with open("_data/catalog.csv", "a", newline="") as f:
              writer = csv.writer(f)
              writer.writerow([
                  data["year"],
                  data["domain"],
                  data["title"],
                  data["representation"],
                  data["realism"],
                  data["scale"],
                  data["url"],
                  data["author"]
              ])
          EOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add dataset entry: ${{ github.event.issue.title }}"
          title: "Add dataset from issue"
          body: "Automated dataset submission from GitHub Issue"
          branch: "dataset-submission-template-${{ github.run_id }}"